name: Deploy Dead Bunker to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'BunkerDosMortos/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Copy private test build (unlisted, not linked from the site)
        run: |
          mkdir -p site/teste-1ff1deba5a67
          rsync -a --exclude 'server.js' --exclude 'package*.json' --exclude 'node_modules' --exclude '*.bat' --exclude 'NOTAS_V9.txt' BunkerDosMortos/ site/teste-1ff1deba5a67/
          sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' site/teste-1ff1deba5a67/index.html

      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
