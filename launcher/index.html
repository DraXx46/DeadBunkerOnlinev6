<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Bunker dos Mortos - Launcher</title>
<style>
  :root { --blood: #8b0000; --blood-bright: #c81d1d; --bone: #d8cfc0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0606; color: var(--bone); font-family: "Segoe UI", Tahoma, Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center;
         background: radial-gradient(ellipse at center, #1a0808 0%, #0a0606 70%); }
  h1 { font-family: Impact, "Arial Black", sans-serif; font-size: 2.2rem; text-transform: uppercase; margin: 0 0 0.3rem;
       text-shadow: 0 0 12px rgba(200, 29, 29, 0.6); }
  .sub { font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--blood-bright); margin-bottom: 2rem; }
  .bar { width: 85%; height: 14px; border: 1px solid #3a1a1a; background: #120606; overflow: hidden; position: relative; }
  .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--blood), var(--blood-bright)); transition: width 0.2s ease; }
  .fill.indet { width: 35% !important; position: absolute; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }
  #txt { margin-top: 1rem; min-height: 2.6rem; font-size: 0.95rem; color: #b7a58f; }
  #txt.err { color: #ff6b6b; }
  button { margin-top: 1rem; padding: 0.7rem 2rem; font-family: Impact, "Arial Black", sans-serif; font-size: 1.05rem;
           letter-spacing: 0.08em; text-transform: uppercase; color: var(--bone); background: linear-gradient(180deg, var(--blood-bright), var(--blood));
           border: 2px solid #3a0000; cursor: pointer; }
  button[hidden] { display: none; }
</style>
</head>
<body>
  <h1>Bunker dos Mortos</h1>
  <div class="sub">Launcher</div>
  <div class="bar"><div id="fill" class="fill indet"></div></div>
  <div id="txt">Iniciando...</div>
  <button id="retry" hidden>Tentar de novo</button>
  <script src="renderer.js"></script>
</body>
</html>
