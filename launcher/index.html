<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file: data:">
<title>Bunker dos Mortos - Launcher</title>
<style>
  :root { --blood: #8b0000; --blood-bright: #c81d1d; --wine: #5a0a14; --bone: #f5f0e8; --muted: #a89a88; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--bone); font-family: "Segoe UI", Tahoma, Arial, sans-serif; user-select: none; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(200, 29, 29, 0.28), transparent 60%),
      radial-gradient(ellipse at 50% 120%, rgba(139, 0, 0, 0.45), transparent 55%),
      linear-gradient(180deg, #120507, #070203);
  }
  /* névoa que se move devagar */
  body::before {
    content: ""; position: fixed; inset: -20%; pointer-events: none;
    background: radial-gradient(circle at 30% 60%, rgba(139, 0, 0, 0.18), transparent 40%),
                radial-gradient(circle at 70% 40%, rgba(90, 10, 20, 0.22), transparent 45%);
    animation: drift 12s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translate(-4%, 2%); } to { transform: translate(4%, -2%); } }

  .logo {
    width: 96px; height: 96px; border-radius: 22px; position: relative; z-index: 1;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 40px rgba(200, 29, 29, 0.35);
    animation: float 3.6s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  h1 {
    position: relative; z-index: 1; margin: 16px 0 2px;
    font-family: Impact, "Arial Black", sans-serif; font-size: 2rem; letter-spacing: 0.04em; text-transform: uppercase;
    text-shadow: 0 0 14px rgba(200, 29, 29, 0.55);
  }
  .sub {
    position: relative; z-index: 1; font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--blood-bright); margin-bottom: 26px;
  }

  .progress {
    position: relative; z-index: 1; width: 86%; height: 18px; border-radius: 3px;
    background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7); overflow: hidden;
  }
  .fill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 0%;
    background: linear-gradient(90deg, #5a0a14, var(--blood), var(--blood-bright));
    box-shadow: 0 0 14px rgba(200, 29, 29, 0.7);
    transition: width 0.25s ease;
  }
  .fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    transform: translateX(-100%); animation: shine 1.8s linear infinite;
  }
  @keyframes shine { to { transform: translateX(100%); } }
  .fill.indet { width: 32% !important; left: -32%; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { to { left: 100%; } }
  .pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; letter-spacing: 0.12em; color: var(--bone); text-shadow: 0 1px 2px #000;
  }

  #txt {
    position: relative; z-index: 1; margin-top: 16px; min-height: 2.6rem; max-width: 92%;
    font-size: 0.92rem; line-height: 1.4; color: var(--muted);
  }
  #txt.err { color: #ff7b7b; }

  button {
    position: relative; z-index: 1; margin-top: 14px; padding: 0.7rem 2.2rem;
    font-family: Impact, "Arial Black", sans-serif; font-size: 1.05rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--bone); background: linear-gradient(180deg, var(--blood-bright), var(--blood));
    border: 1px solid #3a0000; border-radius: 3px; cursor: pointer;
    box-shadow: 0 0 22px rgba(200, 29, 29, 0.4), inset 0 -3px 0 rgba(0, 0, 0, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(200, 29, 29, 0.6), inset 0 -3px 0 rgba(0, 0, 0, 0.35); }
  button[hidden] { display: none; }

  .foot {
    position: absolute; bottom: 10px; left: 0; right: 0; z-index: 1;
    font-size: 0.66rem; letter-spacing: 0.12em; color: #5f5246; text-transform: uppercase;
  }
</style>
</head>
<body>
  <img class="logo" src="build/icon.png" alt="">
  <h1>Bunker dos Mortos</h1>
  <div class="sub">Launcher</div>
  <div class="progress">
    <div id="fill" class="fill indet"></div>
    <div id="pct" class="pct"></div>
  </div>
  <div id="txt">Iniciando...</div>
  <button id="retry" hidden>Tentar de novo</button>
  <div class="foot">feito por Drax</div>
  <script src="renderer.js"></script>
</body>
</html>
